<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronos CDM 2026</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d333b;
    --text: #e6edf3; --muted: #8b949e; --green: #3fb950; --red: #f85149;
    --gold: #d29922; --blue: #58a6ff; --accent: #1f6feb;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 'Segoe UI', sans-serif; padding-bottom: 60px; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 20px; }
  header .sub { color: var(--muted); font-size: 12px; }
  nav { display: flex; gap: 4px; padding: 10px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  nav button { background: none; border: 1px solid transparent; color: var(--muted); padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  nav button.active { background: var(--panel2); color: var(--text); border-color: var(--border); }
  main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .muted { color: var(--muted); } .green { color: var(--green); } .red { color: var(--red); } .gold { color: var(--gold); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; }
  .odds { display: inline-flex; gap: 6px; }
  .odd { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; font-size: 13px; min-width: 58px; text-align: center; }
  .odd small { display: block; color: var(--muted); font-size: 10px; }
  .odd.value { border-color: var(--green); }
  .bar { height: 6px; border-radius: 3px; display: flex; overflow: hidden; margin-top: 6px; }
  .bar div:nth-child(1) { background: var(--blue); }
  .bar div:nth-child(2) { background: var(--muted); }
  .bar div:nth-child(3) { background: var(--gold); }
  h2 { font-size: 16px; margin: 18px 0 10px; }
  .datehead { margin: 22px 0 8px; font-size: 15px; color: var(--blue); border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .pill { background: var(--panel2); border-radius: 12px; padding: 1px 10px; font-size: 11px; color: var(--muted); }
  .evpill { border-radius: 6px; padding: 2px 8px; font-weight: 600; font-size: 13px; }
  .evpill.pos { background: rgba(63,185,80,.15); color: var(--green); }
  button.act { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button.small { font-size: 12px; padding: 4px 10px; }
  button.ghost { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  input, select { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .stat .v { font-size: 22px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12px; }
  #bankrollChart { width: 100%; height: 160px; }
  .strengthbar { height: 8px; background: var(--accent); border-radius: 4px; }
  .warn { background: rgba(210,153,34,.1); border: 1px solid rgba(210,153,34,.4); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--gold); margin-bottom: 14px; }
</style>
</head>
<body>
<header>
  <h1>⚽ Pronos CDM 2026</h1>
  <span class="sub" id="meta">chargement…</span>
</header>
<nav>
  <button data-tab="picks" class="active">💎 Picks du jour</button>
  <button data-tab="parmatch">🎯 Par match</button>
  <button data-tab="combos">🎰 Combinés</button>
  <button data-tab="cal">📅 Calendrier</button>
  <button data-tab="suivi">📒 Suivi</button>
  <button data-tab="teams">📊 Équipes</button>
  <button data-tab="tournoi">🏆 Tournoi</button>
  <button data-tab="mpp">🎯 MPP Scores</button>
</nav>
<main id="main"></main>

<script>
let MODEL, ODDS, PICKS, LINEUPS = {}, SIM = null, BRACKET = null;
let tab = 'picks';
const fmtDate = ts => new Date(ts * 1000).toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const dayKey = ts => new Date(ts * 1000).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const pct = x => (x * 100).toFixed(0) + '%';

const store = {
  get bets() { return JSON.parse(localStorage.getItem('wc_bets') || '[]'); },
  set bets(v) { localStorage.setItem('wc_bets', JSON.stringify(v)); },
  get bank() { return parseFloat(localStorage.getItem('wc_bank') || '100'); },
  set bank(v) { localStorage.setItem('wc_bank', v); },
};

async function load() {
  [MODEL, ODDS, PICKS] = await Promise.all([
    fetch('../data/model.json').then(r => r.json()),
    fetch('../data/odds.json').then(r => r.json()),
    fetch('../data/picks.json').then(r => r.json()),
  ]);
  LINEUPS = await fetch('../data/lineups.json').then(r => r.json()).then(d => d.lineups || {}).catch(() => ({}));
  SIM = await fetch('../data/tournament_sim.json').then(r => r.json()).catch(() => null);
  BRACKET = await fetch('../data/bracket.json').then(r => r.json()).catch(() => null);
  document.getElementById('meta').textContent =
    `cotes Winamax du ${new Date(ODDS.scraped_at * 1000).toLocaleString('fr-FR')} · ${ODDS.matches.length} matchs · ${PICKS.value_bets.length} value bets`;
  render();
}

document.querySelector('nav').onclick = e => {
  if (!e.target.dataset.tab) return;
  tab = e.target.dataset.tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  render();
};

function render() {
  const m = document.getElementById('main');
  if (tab === 'picks') m.innerHTML = renderPicks();
  if (tab === 'parmatch') m.innerHTML = renderParMatch();
  if (tab === 'combos') m.innerHTML = renderCombos();
  if (tab === 'cal') m.innerHTML = renderCal();
  if (tab === 'suivi') { m.innerHTML = renderSuivi(); drawBankroll(); }
  if (tab === 'teams') m.innerHTML = renderTeams();
  if (tab === 'tournoi') m.innerHTML = renderTournoi();
  if (tab === 'mpp') m.innerHTML = renderMPP();
}

// ── Picks ──────────────────────────────────────────────────────────────
function renderPicks() {
  const now = Date.now() / 1000;
  const horizon = now + 48 * 3600;
  const upcoming = PICKS.value_bets.filter(p => p.kickoff > now && p.kickoff < horizon);
  const later = PICKS.value_bets.filter(p => p.kickoff >= horizon);
  let html = `<div class="warn">⚠️ Paris = risque réel. EV basé sur un modèle mélangé 40% modèle / 60% marché — mises Kelly ¼ suggérées sur bankroll de ${store.bank.toFixed(0)}€. Joue responsable (09 74 75 13 13).</div>`;
  html += `<h2>Prochaines 48h</h2>`;
  html += upcoming.length ? upcoming.map(pickCard).join('') : `<p class="muted">Aucun value bet dans les prochaines 48h.</p>`;
  if (later.length) html += `<h2>Plus tard</h2>` + later.slice(0, 15).map(pickCard).join('');
  return html;
}

function pickCard(p) {
  const stake = (p.kelly_pct / 100 * store.bank).toFixed(2);
  return `<div class="card row">
    <div class="grow">
      <div><strong>${p.match}</strong> <span class="pill">Gr. ${p.group || '–'}</span> <span class="pill">${p.marche}</span></div>
      <div class="muted">${fmtDate(p.kickoff)} · pari : <strong>${p.selection_name}</strong></div>
    </div>
    <div class="odds">
      <span class="odd value">${p.cote.toFixed(2)}<small>cote</small></span>
      <span class="odd">${pct(p.proba)}<small>proba</small></span>
      <span class="odd">${stake}€<small>mise ¼K</small></span>
    </div>
    <span class="evpill pos">EV ${(p.ev * 100).toFixed(1)}%</span>
    <button class="act small" onclick='addBet(${JSON.stringify(p).replace(/'/g, "&#39;")}, ${stake})'>+ Suivre</button>
  </div>`;
}

// ── Par match : propositions pour chaque match ─────────────────────────
let pmFilter = 'all';
function renderParMatch() {
  const rawEntries = Object.entries(PICKS.par_match || {}).sort((a, b) => a[1].kickoff - b[1].kickoff);
  if (!rawEntries.length) return `<p class="muted">Relance update.bat pour générer les propositions.</p>`;
  const now = Date.now() / 1000;
  const isMismatchEntry = ([, m]) => {
    if (!m.top_scores || !m.top_scores[0]) return false;
    const [gh, ga] = m.top_scores[0].score.split('-').map(Number);
    return Math.max(gh, ga) >= 2 && Math.abs(gh - ga) >= 2;
  };
  const entries = pmFilter === 'mismatch' ? rawEntries.filter(isMismatchEntry) : rawEntries;
  const nMismatch = rawEntries.filter(isMismatchEntry).length;
  let html = `<div class="row" style="margin-bottom:12px;gap:8px">
    <button class="act small ${pmFilter==='all'?'':'ghost'}" onclick="pmFilter='all';render()">Tous (${rawEntries.length})</button>
    <button class="act small ${pmFilter==='mismatch'?'':'ghost'}" onclick="pmFilter='mismatch';render()" style="${pmFilter==='mismatch'?'':''}">⚡ Favoris écrasants (${nMismatch})</button>
    <span class="muted" style="font-size:12px">Score prédit gold = écart ≥ 2 buts</span>
  </div>`;
  let lastDay = '';
  for (const [match, m] of entries) {
    if (m.kickoff < now) continue;
    const day = dayKey(m.kickoff);
    if (day !== lastDay) { html += `<div class="datehead">${day}</div>`; lastDay = day; }
    const fav = m.favori_1n2;
    const p0 = m.props[0] || fav;
    const lu = p0 ? LINEUPS[p0.home_en + '|' + p0.away_en] || LINEUPS[p0.away_en + '|' + p0.home_en] : null;
    html += `<div class="card">
      <div class="row" style="margin-bottom:6px">
        <strong>${match}</strong> <span class="pill">Gr. ${m.group || '–'}</span>
        <span class="muted">${new Date(m.kickoff * 1000).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</span>
        ${fav ? `<span class="pill" title="favori du modèle">⭐ ${fav.selection_name} ${pct(fav.proba)}</span>` : ''}
        ${lu ? (lu.confirmed ? `<span class="pill" style="color:var(--green)">📋 XI confirmés</span>` : `<span class="pill">🕐 XI pas encore publiés</span>`) : ''}
      </div>
      ${m.pari_sur ? (() => {
        const ps = m.pari_sur;
        return `<div class="row" style="padding:6px 0;border-top:1px solid var(--border);gap:8px;background:rgba(63,185,80,.06);border-radius:6px;padding-left:8px">
          <span style="font-size:11px;color:var(--green);font-weight:600">✅ Pari sûr</span>
          <span class="grow">${ps.marche} : <strong>${ps.selection_name}</strong></span>
          <span class="odd value">${ps.cote.toFixed(2)}<small>cote</small></span>
          <span class="odd">${pct(ps.proba)}<small>proba</small></span>
          <span class="evpill ${ps.ev >= 0 ? 'pos' : ''}" style="${ps.ev < 0 ? 'color:var(--muted)' : ''}">EV ${(ps.ev*100).toFixed(1)}%</span>
          <button class="act small" onclick='addBet(${JSON.stringify(ps).replace(/'/g, "&#39;")}, ${(ps.kelly_pct/100*store.bank).toFixed(2)})'>+</button>
        </div>`;
      })() : ''}
      ${m.top_scores ? (() => {
        const top = m.top_scores[0];
        const [gh, ga] = top.score.split('-').map(Number);
        const isMismatch = Math.max(gh, ga) >= 2 && Math.abs(gh - ga) >= 2;
        const headerStyle = isMismatch ? 'color:var(--gold);font-weight:600' : 'color:var(--muted)';
        const label = isMismatch ? `🎯 Scores les plus probables — <span style="color:var(--gold)">favori écrasant</span>` : '🎯 Scores les plus probables';
        return `<div class="row" style="padding:6px 0;border-top:1px solid var(--border);gap:6px;flex-wrap:wrap">
          <span style="font-size:11px;width:100%;margin-bottom:2px;${headerStyle}">${label}</span>
          ${m.top_scores.map((s, i) => {
            const [h2, a2] = s.score.split('-').map(Number);
            const big = Math.max(h2, a2) >= 2 && Math.abs(h2 - a2) >= 2;
            const cls = i === 0 ? 'odd value' : 'odd';
            const style = big && i === 0 ? 'min-width:68px;text-align:center;border-color:var(--gold);background:rgba(210,153,34,.12)' : 'min-width:58px;text-align:center';
            return `<span class="${cls}" style="${style}"><strong>${s.score}</strong><small>${(s.proba*100).toFixed(1)}%</small></span>`;
          }).join('')}
        </div>`;
      })() : ''}
      ${m.props.map(p => `
        <div class="row" style="padding:4px 0;border-top:1px solid var(--border)">
          <span class="grow">${p.marche} : <strong>${p.selection_name}</strong></span>
          <span class="odd">${p.cote.toFixed(2)}<small>cote</small></span>
          <span class="odd">${pct(p.proba)}<small>proba</small></span>
          <span class="evpill ${p.ev >= 0.03 ? 'pos' : ''}" style="${p.ev < 0.03 ? 'color:var(--muted)' : ''}">EV ${(p.ev * 100).toFixed(1)}%</span>
          <button class="act small" onclick='addBet(${JSON.stringify(p).replace(/'/g, "&#39;")}, ${(p.kelly_pct / 100 * store.bank).toFixed(2)})'>+</button>
        </div>`).join('')}
    </div>`;
  }
  return html;
}

// ── Combinés ───────────────────────────────────────────────────────────
function renderCombos() {
  const combos = (PICKS.combos || []).slice();
  if (!combos.length) return `<p class="muted">Aucun combiné généré. Relance update.bat.</p>`;
  const now = Date.now() / 1000;
  const labels = {
    sur: ['🛡️ Sûr', 'Les 2 sélections les plus probables du jour. Passe souvent, gain modeste.'],
    value: ['💎 Value', 'Uniquement des jambes à EV positif. Seul profil gagnant sur le long terme — proba faible, gros gain.'],
    modere: ['🎯 Modéré', 'Cote 10-50 visée avec les sélections les plus probables (tous marchés). Bon compromis frisson / chance de toucher.'],
    plaisir: ['🎉 Plaisir', 'Grosses cotes que le modèle juge encore crédibles. Gros gain, faible proba — pour se faire plaisir à petite mise.'],
    jackpot: ['🤑 Jackpot', 'Le ticket de rêve : un max de grosses cotes empilées. Proba minuscule, gain énorme. Mise 1-2€ max.'],
    ambitieux: ['🚀 Ambitieux', '4 sélections probables. Grosse cote, faible proba — un coup de poker.'],
  };
  let html = `<div class="warn">⚠️ Un combiné multiplie la marge du bookmaker : seuls les combinés <strong>Value</strong> (EV positif) sont gagnants à long terme. Les combinés <strong>Sûr</strong> passent souvent mais ont une EV négative. 1 jambe max par match (les paris d'un même match sont corrélés). Joue petit (09 74 75 13 13).</div>`;
  // grouper par jour, à venir d'abord
  const future = combos.filter(c => Math.min(...c.legs.map(l => l.kickoff)) > now);
  const days = [...new Set(future.map(c => c.day))].sort();
  if (!days.length) return html + `<p class="muted">Aucun combiné à venir.</p>`;
  for (const day of days) {
    const dayCombos = future.filter(c => c.day === day)
      .sort((a, b) => ['value','modere','plaisir','jackpot','sur','ambitieux'].indexOf(a.type) - ['value','modere','plaisir','jackpot','sur','ambitieux'].indexOf(b.type));
    html += `<div class="datehead">${new Date(day + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</div>`;
    for (const c of dayCombos) {
      const [name, desc] = labels[c.type] || [c.type, ''];
      // Kelly si EV+ (value), sinon mise forfaitaire de suivi 2€ (sûr/ambitieux = -EV)
      const stake = (c.kelly_pct > 0 ? c.kelly_pct / 100 * store.bank : 2).toFixed(2);
      const gain = (c.cote * 5).toFixed(0);
      html += `<div class="card">
        <div class="row" style="margin-bottom:4px">
          <strong>${name}</strong> <span class="pill">${c.legs.length} jambes</span>
          <span class="odd value" style="min-width:auto">×${c.cote.toFixed(2)}<small>cote</small></span>
          <span class="odd">${pct(c.proba)}<small>proba</small></span>
          <span class="evpill ${c.ev >= 0 ? 'pos' : ''}" style="${c.ev < 0 ? 'color:var(--red)' : ''}">EV ${(c.ev*100).toFixed(1)}%</span>
        </div>
        <div class="muted" style="font-size:11px;margin-bottom:6px">${desc} · 5€ misés → ${gain}€ si gagnant</div>
        ${c.legs.map(l => `<div class="row" style="padding:3px 0;border-top:1px solid var(--border);font-size:13px">
          <span class="grow">${l.match} — <strong>${l.selection_name}</strong> <span class="muted">(${l.marche})</span></span>
          <span class="odd" style="min-width:48px">${l.cote.toFixed(2)}</span>
          <span class="muted" style="width:40px;text-align:right">${pct(l.proba)}</span>
        </div>`).join('')}
        <div class="row" style="margin-top:6px">
          <button class="act small" onclick='addCombo(${JSON.stringify(c).replace(/'/g, "&#39;")}, ${stake})'>+ Suivre (${stake}€)</button>
        </div>
      </div>`;
    }
  }
  return html;
}

function addCombo(c, stake) {
  const bets = store.bets;
  bets.push({
    id: Date.now(), match: `Combiné ${c.type} (${c.legs.length} j.)`,
    marche: 'Combiné', sel: c.legs.map(l => l.selection_name).join(' + '),
    selection: 'Combiné : ' + c.legs.map(l => `${l.match.split(' - ')[0]} ${l.selection_name}`).join(' + '),
    cote: c.cote, stake: parseFloat(stake), kickoff: Math.min(...c.legs.map(l => l.kickoff)), result: null,
  });
  store.bets = bets;
  alert('Combiné ajouté au suivi ✔');
}

// ── Calendrier ─────────────────────────────────────────────────────────
function renderCal() {
  const predIdx = {};
  MODEL.matches.forEach(m => predIdx[m.home + '|' + m.away] = m);
  const en = {};
  PICKS.all_picks.forEach(p => en[p.match] = [p.home_en, p.away_en]);
  let html = '', lastDay = '';
  for (const o of ODDS.matches) {
    const day = dayKey(o.kickoff);
    if (day !== lastDay) { html += `<div class="datehead">${day}</div>`; lastDay = day; }
    const names = en[o.title + ''] || en[o.home_fr + ' - ' + o.away_fr] || [];
    let pred = names.length ? (predIdx[names[0] + '|' + names[1]] || predIdx[names[1] + '|' + names[0]]) : null;
    let flipped = pred && pred.home !== names[0];
    const p1 = pred ? (flipped ? pred.p2 : pred.p1) : null;
    const p2 = pred ? (flipped ? pred.p1 : pred.p2) : null;
    html += `<div class="card">
      <div class="row">
        <div class="grow"><strong>${o.home_fr}</strong> – <strong>${o.away_fr}</strong>
          <span class="muted" style="margin-left:8px">${new Date(o.kickoff * 1000).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</span>
          ${pred && pred.group ? `<span class="pill">Gr. ${pred.group}</span>` : ''}
        </div>
        <div class="odds">
          <span class="odd">${o.odds_1 ?? '–'}<small>1</small></span>
          <span class="odd">${o.odds_X ?? '–'}<small>N</small></span>
          <span class="odd">${o.odds_2 ?? '–'}<small>2</small></span>
        </div>
      </div>
      ${pred ? `<div class="bar" title="modèle : 1 ${pct(p1)} / N ${pct(pred.pX)} / 2 ${pct(p2)}">
        <div style="width:${p1 * 100}%"></div><div style="width:${pred.pX * 100}%"></div><div style="width:${p2 * 100}%"></div>
      </div>` : ''}
    </div>`;
  }
  return html;
}

// ── Suivi ──────────────────────────────────────────────────────────────
function addBet(p, stake) {
  const bets = store.bets;
  bets.push({
    id: Date.now(), match: p.match,
    marche: p.marche || 'Résultat', sel: p.selection_name,
    selection: (p.marche ? p.marche + ' : ' : '') + p.selection_name,
    cote: p.cote, stake: parseFloat(stake), kickoff: p.kickoff, result: null,
  });
  store.bets = bets;
  alert('Pari ajouté au suivi ✔');
}

function setResult(id, r) {
  const bets = store.bets;
  const b = bets.find(x => x.id === id);
  if (b) b.result = b.result === r ? null : r;
  store.bets = bets;
  render();
}

function delBet(id) {
  store.bets = store.bets.filter(x => x.id !== id);
  render();
}

function setBank() {
  const v = prompt('Bankroll de départ (€) :', store.bank);
  if (v) { store.bank = parseFloat(v); render(); }
}

// CLV : compare la cote prise a la derniere cote scrapee (≈ closing line si
// scrape proche du coup d'envoi). CLV positif régulier = edge réel, bien avant
// que le ROI soit significatif.
function currentCote(bet) {
  const m = ODDS.matches.find(o => `${o.home_fr} - ${o.away_fr}` === bet.match);
  if (!m) return null;
  for (const b of (m.bets || [])) {
    if (b.marche !== bet.marche) continue;
    const issue = b.issues.find(i => i.label === bet.sel);
    if (issue && issue.cote) return issue.cote;
  }
  if (bet.marche === 'Résultat') {
    if (bet.sel === m.home_fr) return m.odds_1;
    if (bet.sel === 'Match nul') return m.odds_X;
    if (bet.sel === m.away_fr) return m.odds_2;
  }
  return null;
}

function clvPct(bet) {
  const cur = currentCote(bet);
  return cur ? (bet.cote / cur - 1) * 100 : null;
}

function renderSuivi() {
  const bets = store.bets.sort((a, b) => a.kickoff - b.kickoff);
  const done = bets.filter(b => b.result);
  const won = done.filter(b => b.result === 'W');
  const staked = done.reduce((s, b) => s + b.stake, 0);
  const returns = done.reduce((s, b) => s + (b.result === 'W' ? b.stake * b.cote : 0), 0);
  const profit = returns - staked;
  const roi = staked ? profit / staked * 100 : 0;
  const clvs = bets.map(clvPct).filter(v => v !== null);
  const avgClv = clvs.length ? clvs.reduce((s, v) => s + v, 0) / clvs.length : null;
  let html = `<div class="stats">
    <div class="stat"><div class="v">${store.bank.toFixed(0)}€</div><div class="l">bankroll départ <button class="ghost small" onclick="setBank()">modifier</button></div></div>
    <div class="stat"><div class="v">${bets.length}</div><div class="l">paris suivis</div></div>
    <div class="stat"><div class="v">${done.length ? won.length + '/' + done.length : '–'}</div><div class="l">gagnés / réglés</div></div>
    <div class="stat"><div class="v ${profit >= 0 ? 'green' : 'red'}">${profit >= 0 ? '+' : ''}${profit.toFixed(2)}€</div><div class="l">profit</div></div>
    <div class="stat"><div class="v ${roi >= 0 ? 'green' : 'red'}">${roi.toFixed(1)}%</div><div class="l">ROI</div></div>
    <div class="stat"><div class="v ${avgClv === null ? 'muted' : (avgClv >= 0 ? 'green' : 'red')}">${avgClv === null ? '–' : (avgClv >= 0 ? '+' : '') + avgClv.toFixed(1) + '%'}</div><div class="l">CLV moyen (vs dernière cote)</div></div>
  </div>
  <div class="card"><canvas id="bankrollChart"></canvas></div>`;
  if (!bets.length) return html + `<p class="muted">Aucun pari suivi. Ajoute-les depuis l'onglet Picks.</p>`;
  html += `<table><tr><th>Match</th><th>Pari</th><th>Cote</th><th>CLV</th><th>Mise</th><th>Date</th><th>Résultat</th><th></th></tr>`;
  for (const b of bets) {
    const clv = clvPct(b);
    html += `<tr>
      <td>${b.match}</td><td>${b.selection}</td><td>${b.cote.toFixed(2)}</td>
      <td class="${clv === null ? 'muted' : (clv >= 0 ? 'green' : 'red')}">${clv === null ? '–' : (clv >= 0 ? '+' : '') + clv.toFixed(1) + '%'}</td>
      <td>${b.stake.toFixed(2)}€</td>
      <td class="muted">${fmtDate(b.kickoff)}</td>
      <td>
        <button class="small ${b.result === 'W' ? 'act' : 'ghost'}" onclick="setResult(${b.id},'W')">✔</button>
        <button class="small ${b.result === 'L' ? 'act' : 'ghost'}" onclick="setResult(${b.id},'L')">✘</button>
      </td>
      <td><button class="ghost small" onclick="delBet(${b.id})">🗑</button></td>
    </tr>`;
  }
  return html + `</table>`;
}

function drawBankroll() {
  const cv = document.getElementById('bankrollChart');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width = cv.parentElement.clientWidth - 32, H = cv.height = 160;
  const done = store.bets.filter(b => b.result).sort((a, b) => a.kickoff - b.kickoff);
  let bank = store.bank;
  const pts = [bank];
  for (const b of done) { bank += b.result === 'W' ? b.stake * (b.cote - 1) : -b.stake; pts.push(bank); }
  const min = Math.min(...pts) * 0.97, max = Math.max(...pts) * 1.03;
  ctx.strokeStyle = '#3fb950'; ctx.lineWidth = 2; ctx.beginPath();
  pts.forEach((v, i) => {
    const x = pts.length > 1 ? i / (pts.length - 1) * (W - 20) + 10 : W / 2;
    const y = H - 15 - (v - min) / (max - min || 1) * (H - 30);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = '#8b949e'; ctx.font = '11px sans-serif';
  ctx.fillText(max.toFixed(0) + '€', 4, 12);
  ctx.fillText(min.toFixed(0) + '€', 4, H - 4);
}

}

// ── Tournoi : simulation Monte Carlo ───────────────────────────────────
// ── Tournoi : bracket complet match par match ──────────────────────────
function renderTournoi() {
  if (!BRACKET) return `<p class="muted">Fichier bracket.json introuvable.</p>`;
  const B = BRACKET;
  const champion = B.champion;

  // Helper : rendu d'une carte match
  function matchCard(m, label, roundLabel) {
    if (!m) return '';
    const pW = m.home === m.winner ? m.p1 : m.p2;
    const isClose = Math.max(m.p1, m.p2) < 0.45;
    const winColor = isClose ? 'var(--gold)' : 'var(--green)';
    const [sh, sa] = m.score.split('-').map(Number);
    const bigScore = Math.max(sh,sa) >= 2 && Math.abs(sh-sa) >= 2;
    return `<div class="card" style="padding:8px 10px;min-width:210px;max-width:280px;flex:1;${m.winner===champion?'border-color:var(--gold)':''}">
      ${label ? `<div style="font-size:10px;color:var(--blue);margin-bottom:4px;font-weight:600">${label}</div>` : ''}
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
        <span style="flex:1;font-size:13px;font-weight:${m.home===m.winner?700:400};color:${m.home===m.winner?'var(--text)':'var(--muted)'}">${m.home}</span>
        <span style="font-size:18px;font-weight:800;color:${bigScore?'var(--gold)':'var(--text)'};letter-spacing:1px">${m.score}</span>
        <span style="flex:1;font-size:13px;font-weight:${m.away===m.winner?700:400};color:${m.away===m.winner?'var(--text)':'var(--muted)'};text-align:right">${m.away}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">
        <span>λ ${m.lh}–${m.la}</span>
        <span style="color:${winColor};font-weight:600">✓ ${m.winner} <small>(${(pW*100).toFixed(0)}%)</small></span>
        <span>score: ${(m.score_p*100).toFixed(1)}%</span>
      </div>
    </div>`;
  }

  let html = '';

  // ── Champion banner ──
  html += `<div style="text-align:center;margin:16px 0 22px;padding:16px;background:linear-gradient(135deg,rgba(210,153,34,.15),rgba(210,153,34,.05));border:1px solid var(--gold);border-radius:12px">
    <div style="font-size:36px">🏆</div>
    <div style="font-size:24px;font-weight:800;color:var(--gold);margin:4px 0">${champion}</div>
    <div style="font-size:12px;color:var(--muted)">Champion prédit · Bracket officiel FIFA (matchs 73-104) · Forces = Elo eloratings.net + Glicko-2 + Transfermarkt</div>
  </div>`;

  // ── Phase de groupes ──
  html += `<h2 style="margin:0 0 10px">Phase de groupes</h2>
  <p class="muted" style="font-size:12px;margin-bottom:12px">Tous les matchs de chaque groupe · Score le plus probable · Le classement final détermine les qualifiés.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:28px">`;

  for (const [grp, gdata] of Object.entries(B.groups)) {
    html += `<div class="card" style="padding:10px 12px">
      <div style="font-weight:700;color:var(--blue);margin-bottom:8px">Groupe ${grp}
        <span style="font-weight:400;font-size:11px;color:var(--muted);margin-left:6px">Qualifiés → ${gdata.ranking[0]} · ${gdata.ranking[1]}</span>
      </div>`;
    // Classement attendu
    gdata.ranking.forEach((t, i) => {
      const icon = i===0?'🟢':i===1?'🔵':i===2?'⚪':'⚫';
      const bold = i<2;
      html += `<div style="font-size:12px;padding:2px 0;${bold?'font-weight:600':'color:var(--muted)'}">${icon} ${i+1}. ${t}</div>`;
    });
    html += `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:6px">`;
    gdata.matches.forEach(m => {
      const pW = Math.max(m.p1, m.p2);
      const [sh, sa] = m.score.split('-').map(Number);
      const bigScore = Math.max(sh,sa) >= 2 && Math.abs(sh-sa) >= 2;
      html += `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px">
        <span style="flex:1;text-align:right;font-weight:${m.winner===m.home?600:400};color:${m.winner===m.home?'var(--text)':'var(--muted)'}">${m.home}</span>
        <span style="font-weight:700;min-width:28px;text-align:center;color:${bigScore?'var(--gold)':'var(--text)'}">${m.score}</span>
        <span style="flex:1;font-weight:${m.winner===m.away?600:400};color:${m.winner===m.away?'var(--text)':'var(--muted)'}">${m.away}</span>
        <span style="font-size:10px;color:var(--muted);min-width:28px">${(pW*100).toFixed(0)}%</span>
      </div>`;
    });
    html += `</div></div>`;
  }
  html += `</div>`;

  // Helper section KO
  function koSection(title, matches, subtitle) {
    let s = `<h2 style="margin:0 0 6px">${title}</h2>`;
    if (subtitle) s += `<p class="muted" style="font-size:12px;margin-bottom:10px">${subtitle}</p>`;
    s += `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px">`;
    matches.forEach((m, i) => {
      s += matchCard(m, `Match ${i+1}`);
    });
    s += `</div>`;
    return s;
  }

  html += koSection('1/16 de finale', B.r16, '32 équipes qualifiées · 16 matchs à élimination directe');
  html += koSection('1/8 de finale', B.r8, '16 équipes restantes');
  html += koSection('Quarts de finale', B.r4, '8 équipes restantes');
  html += koSection('Demi-finales', B.r2, '4 équipes restantes · les perdants jouent la 3e place');

  // ── Finale ──
  const f = B.final;
  const pF = Math.max(f.p1, f.p2);
  html += `<h2 style="margin:0 0 10px">🏆 Finale</h2>
  <div style="display:flex;justify-content:center;margin-bottom:24px">
    <div class="card" style="max-width:420px;width:100%;padding:20px;border-color:var(--gold);background:linear-gradient(135deg,var(--panel),var(--panel2))">
      <div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:10px">19 juillet 2026 · MetLife Stadium, New York</div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div style="text-align:center;flex:1">
          <div style="font-size:18px;font-weight:${f.winner===f.home?800:400};color:${f.winner===f.home?'var(--gold)':'var(--muted)'}">${f.home}</div>
          <div style="font-size:12px;color:var(--muted)">${(f.p1*100).toFixed(0)}%</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:32px;font-weight:900;color:var(--gold);letter-spacing:2px">${f.score}</div>
          <div style="font-size:10px;color:var(--muted)">score prédit (${(f.score_p*100).toFixed(1)}%)</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">Nul: ${(f.px*100).toFixed(0)}%</div>
        </div>
        <div style="text-align:center;flex:1">
          <div style="font-size:18px;font-weight:${f.winner===f.away?800:400};color:${f.winner===f.away?'var(--gold)':'var(--muted)'}">${f.away}</div>
          <div style="font-size:12px;color:var(--muted)">${(f.p2*100).toFixed(0)}%</div>
        </div>
      </div>
      <div style="text-align:center;margin-top:14px;padding:10px;background:rgba(210,153,34,.1);border-radius:8px">
        <div style="font-size:13px;color:var(--muted)">Champion du Monde 2026</div>
        <div style="font-size:26px;font-weight:800;color:var(--gold)">🏆 ${champion}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">Probabilité de victoire en finale : ${(pF*100).toFixed(0)}%</div>
      </div>
    </div>
  </div>

  <div class="warn">
    ⚠️ Bracket déterministe : le favori de chaque match est retenu à chaque tour. Score = le plus probable selon Poisson+Dixon-Coles. En réalité n'importe quelle équipe peut gagner — voir l'onglet probabilités Monte Carlo. Non destiné aux paris.
  </div>`;

  return html;
}

      const top1ok = actual && m.scores[0] && m.scores[0].score === actual;
      const top3ok = actual && m.scores.slice(0,3).some(s => s.score === actual);

      const time = new Date(m.kickoff*1000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

      let badge = '';
      if (isPlayed) {
        if (top1ok) badge = `<span style="background:rgba(63,185,80,.15);color:var(--green);border:1px solid rgba(63,185,80,.4);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700">✓ EXACT</span>`;
        else if (top3ok) badge = `<span style="background:rgba(210,153,34,.12);color:var(--gold);border:1px solid rgba(210,153,34,.4);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700">~ TOP 3</span>`;
        else badge = `<span style="background:rgba(248,81,73,.1);color:var(--red);border:1px solid rgba(248,81,73,.3);border-radius:5px;padding:1px 7px;font-size:10px;font-weight:700">✗ RATÉ</span>`;
      }

      const p1 = Math.round(m.p1*100), px = Math.round(m.px*100), p2 = Math.round(m.p2*100);

      // Pick brut vs boosted
        const rawPick = m.scores_raw && m.scores_raw[0] ? m.scores_raw[0].score : null;
        const scoreRows = m.scores.map((s,i) => {
        const isActual = s.score === actual;
        const isBest = i === 0;
        const sh = parseInt(s.score[0]), sa = parseInt(s.score[2]);
        const ri = sh>sa?'1':sh===sa?'X':'2';
        const rc = ri==='1'?'var(--blue)':ri==='X'?'var(--muted)':'var(--gold)';
        return `<div style="display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:5px;
          background:${isBest?'rgba(210,153,34,.1)':isActual?'rgba(63,185,80,.1)':'transparent'};
          border:1px solid ${isBest?'rgba(210,153,34,.3)':isActual?'rgba(63,185,80,.3)':'transparent'};
          margin-bottom:2px">
          <span style="font-size:9px;color:${rc};font-weight:700;min-width:10px">${ri}</span>
          <span style="font-size:16px;font-weight:800;letter-spacing:2px;font-family:monospace;color:${isBest?'var(--gold)':isActual?'var(--green)':'var(--text)'}">${s.score}</span>
          ${isBest?'<span style="font-size:9px;background:var(--gold);color:#000;padding:1px 5px;border-radius:3px;font-weight:700">PICK</span>':''}
          ${isActual&&!isBest?'<span style="font-size:9px;background:var(--green);color:#000;padding:1px 5px;border-radius:3px;font-weight:700">RÉEL</span>':''}
          <div style="flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden">
            <div style="height:100%;width:${Math.min(s.p/m.scores[0].p*100,100).toFixed(0)}%;background:${isBest?'var(--gold)':'var(--blue)'};opacity:0.4;border-radius:2px"></div>
          </div>
          <span style="font-size:11px;font-weight:600;color:${isBest?'var(--gold)':'var(--muted)'};min-width:34px;text-align:right">${s.p}%</span>
        </div>`;
      }).join('');

      const confColor = m.confidence==='haute'?'var(--green)':m.confidence==='moyenne'?'var(--blue)':'var(--muted)';
      const confLabel = m.confidence==='haute'?'⭐ Haute':m.confidence==='moyenne'?'✦ Moyenne':'· Faible';
      html += `<div class="card" style="border-color:${top1ok?'rgba(63,185,80,.4)':isPlayed&&!top3ok?'rgba(248,81,73,.15)':'var(--border)'}">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
          <span style="font-size:10px;font-weight:700;color:var(--muted);background:var(--panel2);padding:2px 7px;border-radius:4px">GR.${m.group}</span>
          <span style="font-size:11px;color:var(--muted)">${time}</span>
          <span style="font-size:10px;color:var(--muted)">λ ${m.eg_h}/${m.eg_a}</span>
          <span style="font-size:10px;font-weight:600;color:${confColor}">${confLabel}</span>
          <div style="flex:1"></div>
          ${isPlayed
  ? `<span style="font-size:11px;color:var(--muted)">Résultat: <strong style="color:var(--text)">${actual}</strong></span> ${badge}`
  : m.kickoff < now
    ? '<span style="font-size:10px;color:var(--muted);background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.2);border-radius:4px;padding:1px 6px">Résultat inconnu</span>'
    : '<span style="font-size:10px;color:var(--muted)">À venir</span>'
}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px">
          <div style="display:flex;align-items:center;gap:5px">
            <span style="font-size:20px">${m.flag_h}</span>
            <span style="font-weight:600;font-size:13px">${m.home}</span>
          </div>
          <span style="font-size:10px;color:var(--muted);font-weight:600">VS</span>
          <div style="display:flex;align-items:center;gap:5px">
            <span style="font-weight:600;font-size:13px">${m.away}</span>
            <span style="font-size:20px">${m.flag_a}</span>
          </div>
        </div>
        <div style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:2px">
            <span style="color:var(--blue)">${p1}%</span><span>Nul ${px}%</span><span style="color:var(--gold)">${p2}%</span>
          </div>
          <div class="bar" style="height:4px"><div style="width:${p1}%"></div><div style="width:${px}%"></div><div style="width:${p2}%"></div></div>
        </div>
        <div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px;font-weight:600;display:flex;justify-content:space-between">
          <span>Top 5 scores · Boost ×1.38 dom / ×0.81 ext</span>
          ${!isPlayed && m.pick_mean ? `<span style="color:var(--muted)">λ moyen: <strong style="color:var(--blue)">${m.pick_mean}</strong></span>` : ''}
        </div>
        ${scoreRows}
        ${rawPick && rawPick !== m.scores[0].score && !isPlayed
          ? `<div style="font-size:10px;color:var(--muted);margin-top:4px">Modèle brut: <span style="color:var(--muted);text-decoration:line-through">${rawPick}</span> → boost CdM: <strong style="color:var(--gold)">${m.scores[0].score}</strong></div>`
          : ''}
        <div style="margin-top:7px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);padding-top:6px">💡 ${m.strat}</div>
      </div>`;
    });

    html += `</div>`;
  });

  return html;
}

load();
</script>
</body>
</html>
